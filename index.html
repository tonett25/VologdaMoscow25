<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вологда ➔ Москва 2D: Путь к Еве</title>
  <style>
    :root {
      --bg: #0b0d14;
      --card-bg: rgba(22, 25, 38, 0.9);
      --accent: #ff4d6d;
      --gold: #f6c445;
      --green: #79f7ba;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      touch-action: none;
    }

    #gameWrapper {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    #canvas {
      width: 100%;
      flex: 1;
      display: block;
      background: #111;
      image-rendering: pixelated;
    }

    .game-hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 18, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 14px;
      backdrop-filter: blur(8px);
      z-index: 10;
      font-size: 13px;
      font-weight: 700;
    }

    .hud-left {
      color: var(--green);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .hud-flowers {
      color: var(--accent);
    }

    .controls-bar {
      height: 140px;
      background: rgba(14, 16, 26, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px 10px;
      z-index: 10;
    }

    .dpad-group {
      display: flex;
      gap: 16px;
    }

    .ctrl-btn {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .ctrl-btn:active, .ctrl-btn.active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.22);
      border-color: #fff;
    }

    .action-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.45);
    }

    .action-btn span {
      font-size: 10px;
      font-weight: 700;
      opacity: 0.9;
    }

    .action-btn:active, .action-btn.active {
      transform: scale(0.92);
      background: linear-gradient(135deg, #ff758f, #a01037);
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(7, 9, 15, 0.88);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: #181b29;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--gold);
      text-align: center;
    }

    .modal-desc {
      font-size: 13px;
      color: #cfd4e6;
      line-height: 1.45;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 10px;
      border-radius: 14px;
    }

    .modal-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dialog-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 12px 14px;
      color: #f1f3f9;
      font-size: 13px;
      line-height: 1.35;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .dialog-btn:active {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(0.98);
    }

    .dialog-btn.btn-wrong {
      border-color: var(--accent);
      background: rgba(255, 77, 109, 0.2);
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .final-heart-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: 8px auto 0;
      animation: pulse 1.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .photos-grid {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
      width: 100%;
    }

    .photo-frame {
      aspect-ratio: 4/5;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 77, 109, 0.4);
      background: #111;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #confettiCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 200;
    }
  </style>
</head>
<body>

<audio id="bgMusic" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="gameWrapper">
  <div class="game-hud">
    <div class="hud-left">
      <span>●</span> <span id="hudLevelName">Вологда: Поезд 2+5</span>
    </div>
    <div class="hud-flowers">
      💐 <span id="hudBouquet">100%</span>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div class="controls-bar">
    <div class="dpad-group">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
    <button class="action-btn" id="btnJump">
      A
      <span>ПРЫЖОК</span>
    </button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <canvas id="confettiCanvas"></canvas>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const state = {
    level: 1,
    bouquet: 100,
    musicStarted: false,
    cameraX: 0,
    keys: { left: false, right: false, jump: false },
    modalOpen: false,
    invincibleTimer: 0
  };

  const player = {
    x: 60,
    y: 200,
    w: 30,
    h: 56,
    vx: 0,
    vy: 0,
    speed: 3.8,
    jumpForce: -11.5,
    grounded: false,
    facing: 1
  };

  const gravity = 0.58;

  let platforms = [];
  let hazards = [];
  let pickups = [];
  let npcs = [];
  let goalX = 1400;

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(freq, type = 'square', dur = 0.1) {
    try {
      const c = getAudioCtx();
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, c.currentTime);
      g.gain.setValueAtTime(0.12, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      osc.connect(g);
      g.connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + dur);
    } catch(e) {}
  }

  function sfxJump() {
    playTone(280, 'square', 0.08);
    setTimeout(() => playTone(420, 'square', 0.1), 40);
  }

  function sfxCollect() {
    playTone(550, 'sine', 0.08);
    setTimeout(() => playTone(880, 'sine', 0.15), 60);
  }

  function sfxError() {
    playTone(160, 'sawtooth', 0.2);
  }

  function startMusic() {
    if (!state.musicStarted) {
      const m = document.getElementById('bgMusic');
      if (m) {
        m.play().then(() => { state.musicStarted = true; }).catch(() => {});
      }
    }
  }

  function damageBouquet(amount) {
    sfxError();
    state.bouquet = Math.max(10, state.bouquet - amount);
    document.getElementById('hudBouquet').innerText = state.bouquet + '%';
  }

  function setupLevel(lvl) {
    state.level = lvl;
    player.x = 60;
    player.y = 150;
    player.vx = 0;
    player.vy = 0;
    state.cameraX = 0;
    state.invincibleTimer = 0;

    const floorY = canvas.height - 40;

    if (lvl === 1) {
      document.getElementById('hudLevelName').innerText = 'Вологда: Препятствия сугробов';
      goalX = 1500;

      // Платформы с ямами и паркуром по крышам
      platforms = [
        { x: 0, y: floorY, w: 320, h: 80, type: 'snow' },
        { x: 220, y: floorY - 55, w: 75, h: 14, type: 'roof' },
        { x: 330, y: floorY - 105, w: 75, h: 14, type: 'roof' },
        { x: 400, y: floorY, w: 280, h: 80, type: 'snow' },
        { x: 460, y: floorY - 65, w: 85, h: 14, type: 'roof' },
        { x: 700, y: floorY - 75, w: 70, h: 14, type: 'bench' },
        { x: 780, y: floorY, w: 300, h: 80, type: 'snow' },
        { x: 990, y: floorY - 60, w: 80, h: 14, type: 'snowdrift' },
        { x: 1080, y: floorY, w: 500, h: 80, type: 'snow' }
      ];

      // Опасности уровня 1
      hazards = [
        { x: 325, y: floorY + 10, w: 70, h: 30, type: 'ice_spikes', icon: '❄️' },
        { x: 685, y: floorY + 10, w: 90, h: 30, type: 'ice_spikes', icon: '❄️' },
        { x: 920, y: floorY - 25, w: 28, h: 25, type: 'snowball', icon: '⚪', vx: -1.8, minX: 800, maxX: 960 }
      ];

      pickups = [
        { x: 240, y: floorY - 85, w: 22, h: 22, label: '📱', name: '17 айфон' },
        { x: 350, y: floorY - 135, w: 22, h: 22, label: '🛂', name: 'Паспорт' },
        { x: 820, y: floorY - 30, w: 22, h: 22, label: '💐', name: 'Букет' }
      ];

      npcs = [
        { x: 600, y: floorY - 56, w: 32, h: 56, type: 'taxi', icon: '🚖', triggerDist: 40, triggered: false, trigger: triggerTaxiDialog },
        { x: 1380, y: floorY - 56, w: 32, h: 56, type: 'conductor', icon: '👮‍♀️', triggerDist: 50, triggered: false, trigger: triggerFortunovnaDialog }
      ];

      showModal(`
        <div class="modal-title">Суматоха вечером 4 декабря</div>
        <div class="modal-desc">
          <b>ОПОЗДАНИЕ НА ВОКЗАЛ!</b><br>
          Поезд 2+5 отходит совсем скоро! Собирай вещи и вали на вокзал, фуфло
        </div>
        <button class="dialog-btn" style="text-align:center; font-weight:700;" onclick="closeModal()">
          Погнали ➔
        </button>
      `);
    }

    else if (lvl === 2) {
      document.getElementById('hudLevelName').innerText = 'Поезд 2+5: Препятствия плацкарта';
      goalX = 1550;

      // Спальные полки плацкарта
      platforms = [
        { x: 0, y: floorY, w: 1700, h: 80, type: 'train_carpet' },
        { x: 180, y: floorY - 55, w: 100, h: 12, type: 'bunk_bottom' },
        { x: 180, y: floorY - 115, w: 100, h: 12, type: 'bunk_top' },
        { x: 380, y: floorY - 55, w: 100, h: 12, type: 'bunk_bottom' },
        { x: 380, y: floorY - 115, w: 100, h: 12, type: 'bunk_top' },
        { x: 680, y: floorY - 55, w: 100, h: 12, type: 'bunk_bottom' },
        { x: 680, y: floorY - 115, w: 100, h: 12, type: 'bunk_top' },
        { x: 980, y: floorY - 55, w: 100, h: 12, type: 'bunk_bottom' },
        { x: 980, y: floorY - 115, w: 100, h: 12, type: 'bunk_top' }
      ];

      // Опасности плацкарта (чемодан на колёсиках, ноги соседа, кипяток)
      hazards = [
        { x: 290, y: floorY - 35, w: 25, h: 35, type: 'legs', icon: '🦶' },
        { x: 550, y: floorY - 26, w: 32, h: 26, type: 'moving_bag', icon: '🧳', vx: -1.8, minX: 480, maxX: 630 },
        { x: 880, y: floorY - 10, w: 35, h: 10, type: 'hot_water', icon: '♨️' }
      ];

      pickups = [
        { x: 220, y: floorY - 140, w: 20, h: 20, label: '☕', name: 'Чай' },
        { x: 720, y: floorY - 140, w: 20, h: 20, label: '💧', name: 'Вода' }
      ];

      npcs = [
        { x: 420, y: floorY - 56, w: 32, h: 56, type: 'uncle_tolya', icon: '🍗', triggerDist: 50, triggered: false, trigger: triggerUncleTolyaDialog },
        { x: 820, y: floorY - 56, w: 32, h: 56, type: 'socket', icon: '🔌', triggerDist: 40, triggered: false, trigger: triggerChargerDialog },
        { x: 1350, y: floorY - 56, w: 32, h: 56, type: 'toilet_tap', icon: '🚿', triggerDist: 40, triggered: false, trigger: triggerToiletWaterDialog }
      ];
    }

    else if (lvl === 3) {
      document.getElementById('hudLevelName').innerText = 'Москва: Прорыв через вокзал';
      goalX = 1250;

      platforms = [
        { x: 0, y: floorY, w: 1500, h: 80, type: 'station_floor' },
        { x: 240, y: floorY - 50, w: 80, h: 14, type: 'station_bench' },
        { x: 480, y: floorY - 55, w: 80, h: 14, type: 'station_bench' },
        { x: 740, y: floorY - 55, w: 80, h: 14, type: 'station_bench' }
      ];

      // Опасности Ярославского вокзала (тележки, спешащие пассажиры)
      hazards = [
        { x: 380, y: floorY - 30, w: 32, h: 30, type: 'cart', icon: '🛒', vx: -2.2, minX: 310, maxX: 450 },
        { x: 640, y: floorY - 30, w: 32, h: 30, type: 'cart', icon: '🛒', vx: -2.4, minX: 570, maxX: 710 },
        { x: 890, y: floorY - 45, w: 25, h: 45, type: 'hurrying_man', icon: '🏃‍♂️', vx: -1.6, minX: 820, maxX: 950 }
      ];

      pickups = [];

      npcs = [
        { x: 550, y: floorY - 56, w: 32, h: 56, type: 'crowd', icon: '🏃💨', triggerDist: 50, triggered: false, trigger: triggerPlatformCrowdDialog },
        { x: 1100, y: floorY - 56, w: 32, h: 56, type: 'eva', icon: '👧🏻', triggerDist: 45, triggered: false, trigger: triggerFinalEvaEncounter }
      ];
    }
  }

  function showModal(html) {
    state.modalOpen = true;
    const overlay = document.getElementById('modalOverlay');
    const card = document.getElementById('modalCard');
    card.innerHTML = html;
    overlay.style.display = 'flex';
  }

  function closeModal() {
    state.modalOpen = false;
    document.getElementById('modalOverlay').style.display = 'none';
  }

  function triggerTaxiDialog() {
    showModal(`
      <div class="modal-title">ТАКСИСТ НА ПЕРЕКРЁСТКЕ МИРА</div>
      <div class="modal-desc">
        Водитель: «Братуха, на мосту пробка из-за снегоуборщика! Как едем — в объезд через Ленинградку или напролом?»
      </div>
      <div class="modal-options">
        <button class="dialog-btn" onclick="handleTaxiChoice(this, false)">«Давай напролом через мост, успеем проскочить!»</button>
        <button class="dialog-btn" onclick="handleTaxiChoice(this, true)">«Сворачивай во дворы через Чехова и вокзальную площадь!»</button>
        <button class="dialog-btn" onclick="handleTaxiChoice(this, false)">«Водила, почувствуй мой вайб и заскочи в 7 школу, зачем мне эта Москва?»</button>
      </div>
    `);
  }

  function handleTaxiChoice(btn, isRight) {
    if (isRight) {
      sfxCollect();
      closeModal();
    } else {
      btn.classList.add('btn-wrong');
      damageBouquet(15);
      setTimeout(() => btn.classList.remove('btn-wrong'), 500);
    }
  }

  function triggerFortunovnaDialog() {
    showModal(`
      <div class="modal-title">Галина Фортуновна (стаж 24 года)</div>
      <div class="modal-desc">
        «Так, молодой человек, перрон скользкий, ты щас упадаешь и станешь мальчиком в морге! Куда вы с веником бежите без очереди? Где оригинал билета и паспорта?!»
      </div>
      <div class="modal-options">
        <button class="dialog-btn" onclick="handleFortunovnaChoice(this, false)">«Женщина, уйди нахуй по братски»</button>
        <button class="dialog-btn" onclick="handleFortunovnaChoice(this, true)">«Галина Фортуновна, вот паспорт. А букет прямиком в Москву к кое какой мусе»</button>
        <button class="dialog-btn" onclick="handleFortunovnaChoice(this, false)">«Ну посмотри скриншот паспорта на телефоне, че ты пристала?»</button>
      </div>
    `);
  }

  function handleFortunovnaChoice(btn, isRight) {
    if (isRight) {
      sfxCollect();
      showModal(`
        <div class="modal-title">БИЛЕТ ПРОВЕРЕН!</div>
        <div class="modal-desc">
          «Ой, романтик какой из Вологды! Сразу видно — фанат хаззи би.. Проходи на свое 25 место, я тебе кипяточку дам и лавкульт включу»
        </div>
        <button class="dialog-btn" style="text-align:center; font-weight:700;" onclick="setupLevel(2); closeModal();">
          Зайти в поезд 2+5 ➔
        </button>
      `);
    } else {
      btn.classList.add('btn-wrong');
      damageBouquet(10);
      setTimeout(() => btn.classList.remove('btn-wrong'), 500);
    }
  }

  function triggerUncleTolyaDialog() {
    showModal(`
      <div class="modal-title">Дядя Толя с курицей (Данилов)</div>
      <div class="modal-desc">
        «Парень, бросай свой телефон! Бери ножку с чесночком, щас за жизнь поболтаем до утра!»
      </div>
      <div class="modal-options">
        <button class="dialog-btn" onclick="handleTolyaChoice(this, false)">Взять жирную ножку курицы руками (цветы будут вонять хейтерами фортуны)</button>
        <button class="dialog-btn" onclick="handleTolyaChoice(this, true)">«Спасибо, дядь Толь! Давайте я лучше чай из Аланьи вам заварю епта, а пока Еве нужно черкануть»</button>
      </div>
    `);
  }

  function handleTolyaChoice(btn, isRight) {
    if (isRight) {
      sfxCollect();
      showModal(`
        <div class="modal-title">ДИПЛОМАТИЯ ПЛАЦКАРТА!</div>
        <div class="modal-desc">
          Дядя Толя доволен турецким чаем и теперь плачет от твоей истории 26.10.26, охраняя твой букет.
        </div>
        <button class="dialog-btn" style="text-align:center; font-weight:700;" onclick="closeModal()">
          Продолжить путь ➔
        </button>
      `);
    } else {
      btn.classList.add('btn-wrong');
      damageBouquet(15);
      setTimeout(() => btn.classList.remove('btn-wrong'), 500);
    }
  }

  function triggerChargerDialog() {
    showModal(`
      <div class="modal-title">Айфон сел: 4% заряда!</div>
      <div class="modal-desc">
        Ева ждет сообщение, а розетка в коридоре занята, бля, а че это вообще?
      </div>
      <div class="modal-options">
        <button class="dialog-btn" onclick="handleChargerChoice(this, false)">Выдернуть провод и поцеловать соседа, чтобы не расстраивался</button>
        <button class="dialog-btn" onclick="handleChargerChoice(this, true)">Предложить попутчикам послушать плейбоя карти и спокойно зарядить телефон</button>
      </div>
    `);
  }

  function handleChargerChoice(btn, isRight) {
    if (isRight) {

  function revealEndingSurprise() {
    startMusic();
    sfxCollect();
    startConfetti();
    const btn = document.getElementById('finalHeartBtn');
    const textReveal = document.getElementById('finalTextReveal');
    const photos = document.getElementById('photosBox');
    if (btn) btn.style.display = 'none';
    if (textReveal) textReveal.style.display = 'flex';
    if (photos) photos.style.display = 'grid';

  function drawBackground(lvl, camX) {
    const w = canvas.width;
    const h = canvas.height;
    const floorY = h - 40;

    if (lvl === 1) {
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#0c1020');
      grad.addColorStop(1, '#1b2238');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      const roomEnd = 500 - camX;
      if (roomEnd > 0) {
        ctx.fillStyle = '#221e2e';
        ctx.fillRect(-camX, 0, 500, floorY);

        ctx.fillStyle = 'rgba(255, 230, 150, 0.08)';
        ctx.beginPath();
        ctx.moveTo(250 - camX, 20);
        ctx.lineTo(100 - camX, floorY);
        ctx.lineTo(400 - camX, floorY);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(180 - camX, 80, 80, 100);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 3;
        ctx.strokeRect(180 - camX, 80, 80, 100);
      }

      const streetStart = 500 - camX;
      ctx.fillStyle = '#181f33';
      ctx.fillRect(streetStart, 60, 300, floorY - 60);

      const vokzalX = 1150 - camX;
      ctx.fillStyle = '#2b354f';
      ctx.fillRect(vokzalX, 40, 350, floorY - 40);
      ctx.fillStyle = '#f6c445';
      ctx.font = 'bold 12px monospace';
      ctx.fillText('ВОЛОГДА-1  ПОЕЗД 2+5', vokzalX + 80, 70);

      for (let lx = 600; lx < 1400; lx += 220) {
        const sx = lx - camX;
        ctx.fillStyle = '#475569';
        ctx.fillRect(sx, floorY - 100, 6, 100);
        ctx.fillStyle = 'rgba(255, 220, 100, 0.2)';
        ctx.beginPath();
        ctx.arc(sx + 3, floorY - 105, 25, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    else if (lvl === 2) {
      ctx.fillStyle = '#161924';
      ctx.fillRect(0, 0, w, h);

      for (let wx = 80; wx < 1600; wx += 220) {
        const sx = wx - camX;
        ctx.fillStyle = '#090b14';
        ctx.fillRect(sx, floorY - 160, 130, 70);
        ctx.fillStyle = '#f6c445';
        ctx.fillRect(sx + 40, floorY - 130, 4, 4);
        ctx.fillRect(sx + 90, floorY - 140, 3, 3);
        ctx.strokeStyle = '#383d54';
        ctx.lineWidth = 4;
        ctx.strokeRect(sx, floorY - 160, 130, 70);
      }

      for (let px = 30; px < 1600; px += 220) {
        const sx = px - camX;
        ctx.fillStyle = '#262a3d';
        ctx.fillRect(sx, 40, 12, floorY - 40);
      }

      const titanX = 1280 - camX;
      ctx.fillStyle = '#718096';
      ctx.fillRect(titanX, floorY - 110, 35, 110);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(titanX + 8, floorY - 120, 19, 10);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.arc(titanX + 17, floorY - 135, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    else if (lvl === 3) {
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#131622');
      grad.addColorStop(1, '#23293d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = '#323a54';
      ctx.lineWidth = 6;
      for (let ax = 100; ax < 1300; ax += 260) {
        const sx = ax - camX;
        ctx.beginPath();
        ctx.arc(sx, 120, 90, Math.PI, 0);
        ctx.stroke();
      }

      const tabX = 400 - camX;
      ctx.fillStyle = '#0f111a';
      ctx.fillRect(tabX, 50, 220, 45);
      ctx.strokeStyle = '#4f587a';
      ctx.strokeRect(tabX, 50, 220, 45);
      ctx.fillStyle = '#ffb703';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('МОСКВА-ЯРОСЛАВСКАЯ', tabX + 35, 68);
      ctx.fillStyle = '#79f7ba';
      ctx.fillText('ПОЕЗД 2+5: ПРИБЫЛ', tabX + 44, 84);

      const clockX = 1110 - camX;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(clockX, 85, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(clockX, 85);
      ctx.lineTo(clockX, 72);
      ctx.moveTo(clockX, 85);
      ctx.lineTo(clockX + 8, 85);
      ctx.stroke();
    }
  }

  function drawPlayer(p, camX) {
    const sx = p.x - camX;
    const sy = p.y;
    const dir = p.facing;

    // Эффект мигания при неуязвимости
    if (state.invincibleTimer > 0 && Math.floor(state.invincibleTimer / 5) % 2 === 0) {
      return;
    }

    ctx.save();
    ctx.translate(sx + p.w / 2, sy + p.h / 2);
    if (dir < 0) ctx.scale(-1, 1);

    // Голова и волосы
    ctx.fillStyle = '#18181b';
    ctx.fillRect(-9, -27, 18, 14);
    ctx.fillStyle = '#ffd1b3';
    ctx.fillRect(-7, -19, 14, 11);
    ctx.fillStyle = '#111';
    ctx.fillRect(1, -16, 3, 3);

    // Чёрный оверсайз PAINBOY
    ctx.fillStyle = '#101114';
    ctx.fillRect(-13, -8, 26, 24);
    ctx.fillRect(-16, -8, 5, 11);
    ctx.fillRect(11, -8, 5, 11);

    // Принт с фото: Заяц-панк или логотип
    if (dir > 0) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-2, 3, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-5, 0);
      ctx.lineTo(-9, -6);
      ctx.lineTo(-4, -4);
      ctx.lineTo(-1, -8);
      ctx.lineTo(2, -4);
      ctx.lineTo(7, -6);
      ctx.lineTo(3, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#101114';
      ctx.fillRect(-2, 1, 2, 4);
      ctx.fillRect(-4, 2, 6, 2);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-4, 7, 3, 2);
      ctx.fillRect(0, 7, 3, 2);
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 5px monospace';
      ctx.fillText('PAINBOY.', -12, 4);
    }

    // Джинсы
    ctx.fillStyle = '#1e2433';
    ctx.fillRect(-10, 16, 8, 12);
    ctx.fillRect(2, 16, 8, 12);

    // Кроссовки
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-11, 28, 9, 3);
    ctx.fillRect(2, 28, 9, 3);

    // Букет
    ctx.fillStyle = '#2d6a4f';
    ctx.fillRect(10, 0, 3, 9);
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    ctx.arc(12, -2, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff758f';
    ctx.beginPath();
    ctx.arc(15, -4, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c084fc';
    ctx.fillRect(9, 2, 7, 7);

    ctx.restore();
  }

  function update() {
    if (state.modalOpen) return;

    if (state.invincibleTimer > 0) {
      state.invincibleTimer--;
    }

    // Movement
    if (state.keys.left) {
      player.vx = -player.speed;
      player.facing = -1;
      startMusic();
    } else if (state.keys.right) {
      player.vx = player.speed;
      player.facing = 1;
      startMusic();
    } else {
      player.vx = 0;
    }

    // Jump
    if (state.keys.jump && player.grounded) {
      player.vy = player.jumpForce;
      player.grounded = false;
      sfxJump();
      startMusic();
    }

    // Gravity
    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;

    // Platform Collisions
    player.grounded = false;
    for (const plat of platforms) {
      if (
        player.x + player.w > plat.x &&
        player.x < plat.x + plat.w &&
        player.y + player.h >= plat.y &&
        player.y + player.h <= plat.y + 16 &&
        player.vy >= 0
      ) {
        player.y = plat.y - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }

    // Падение за нижнюю границу (яма)
    if (player.y > canvas.height + 50) {
      damageBouquet(15);
      player.x = Math.max(60, player.x - 220);
      player.y = 120;
      player.vy = 0;
      state.invincibleTimer = 60;
    }

    // Препятствия и ловушки
    for (const h of hazards) {
      if (h.vx) {
        h.x += h.vx;
        if (h.x <= h.minX || h.x >= h.maxX) h.vx *= -1;
      }

      if (state.invincibleTimer === 0 &&
          player.x + player.w > h.x &&
          player.x < h.x + h.w &&
          player.y + player.h > h.y &&
          player.y < h.y + h.h) {
        damageBouquet(8);
        player.vx = -6 * player.facing;
        player.vy = -7;
        state.invincibleTimer = 45;
        break;
      }
    }

    // Camera follow player
    const targetCamX = player.x - canvas.width * 0.35;
    state.cameraX += (targetCamX - state.cameraX) * 0.1;
    if (state.cameraX < 0) state.cameraX = 0;

    // Pickups collision
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      if (
        player.x + player.w > p.x &&
        player.x < p.x + p.w &&
        player.y + player.h > p.y &&
        player.y < p.y + p.h
      ) {
        sfxCollect();
        pickups.splice(i, 1);
      }
    }

    // NPCs & Triggers
    for (const n of npcs) {
      const dist = Math.abs((player.x + player.w / 2) - (n.x + n.w / 2));
      if (dist < n.triggerDist && !n.triggered) {
        n.triggered = true;
        player.vx = 0;
        n.trigger();
        break;
      }
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackground(state.level, state.cameraX);

    // Platforms
    for (const plat of platforms) {
      const sx = plat.x - state.cameraX;
      if (plat.type === 'snow') {
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(sx, plat.y, plat.w, 8);
        ctx.fillStyle = '#334155';
        ctx.fillRect(sx, plat.y + 8, plat.w, plat.h - 8);
      } else if (plat.type === 'train_carpet') {
        ctx.fillStyle = '#851928';
        ctx.fillRect(sx, plat.y, plat.w, plat.h);
        ctx.fillStyle = '#f6c445';
        ctx.fillRect(sx, plat.y, plat.w, 4);
      } else if (plat.type.startsWith('bunk')) {
        ctx.fillStyle = '#1e3a8a';
        ctx.fillRect(sx, plat.y, plat.w, plat.h);
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(sx, plat.y - 3, plat.w, 3);
      } else if (plat.type === 'roof') {
        ctx.fillStyle = '#475569';
        ctx.fillRect(sx, plat.y, plat.w, plat.h);
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(sx, plat.y, plat.w, 3);
      } else {
        ctx.fillStyle = '#475569';
        ctx.fillRect(sx, plat.y, plat.w, plat.h);
      }
    }

    // Hazards
    for (const h of hazards) {
      const sx = h.x - state.cameraX;
      ctx.font = '22px sans-serif';
      ctx.fillText(h.icon, sx, h.y + h.h);
    }

    // Pickups
    for (const it of pickups) {
      const sx = it.x - state.cameraX;
      ctx.font = '20px sans-serif';
      ctx.fillText(it.label, sx, it.y + 16);
    }

    // NPCs
    for (const n of npcs) {
      const sx = n.x - state.cameraX;
      ctx.font = '28px sans-serif';
      ctx.fillText(n.icon, sx, n.y + 40);
    }

    drawPlayer(player, state.cameraX);

    requestAnimationFrame(gameLoop);
  }

  function gameLoop() {
    update();
    render();
  }

  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');
  const btnJump = document.getElementById('btnJump');

  function bindTouch(btn, onDown, onUp) {
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); btn.classList.add('active'); });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); btn.classList.remove('active'); });
    btn.addEventListener('mousedown', () => { onDown(); btn.classList.add('active'); });
    btn.addEventListener('mouseup', () => { onUp(); btn.classList.remove('active'); });
  }

  bindTouch(btnLeft, () => { state.keys.left = true; }, () => { state.keys.left = false; });
  bindTouch(btnRight, () => { state.keys.right = true; }, () => { state.keys.right = false; });
  bindTouch(btnJump, () => { state.keys.jump = true; }, () => { state.keys.jump = false; });

  window.addEventListener('keydown', (e) => {
    startMusic();
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') state.keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') state.keys.right = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') state.keys.jump = true;
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') state.keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') state.keys.right = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') state.keys.jump = false;
  });

  function startConfetti() {
    const c = document.getElementById('confettiCanvas');
    const cc = c.getContext('2d');
    c.width = window.innerWidth;
    c.height = window.innerHeight;

    const parts = [];
    const colors = ['#ff4d6d', '#ff758f', '#ffb703', '#ffffff', '#79f7ba'];

    for (let i = 0; i < 90; i++) {
      parts.push({
        x: c.width / 2,
        y: c.height / 2,
        vx: (Math.random() - 0.5) * 16,
        vy: (Math.random() - 0.5) * 16 - 4,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * 360,
        spin: (Math.random() - 0.5) * 12
      });
    }

    let frame = 0;
    function anim() {
      cc.clearRect(0, 0, c.width, c.height);
      parts.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.rot += p.spin;
        cc.save();
        cc.translate(p.x, p.y);
        cc.rotate((p.rot * Math.PI) / 180);
        cc.fillStyle = p.color;
        cc.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        cc.restore();
      });

      frame++;
      if (frame < 180) requestAnimationFrame(anim);
      else cc.clearRect(0, 0, c.width, c.height);
    }
    anim();
  }

  setupLevel(1);
  requestAnimationFrame(gameLoop);
</script>
